name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q tests/

  transformers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        transformers:
          - "transformers>=4.49,<5"
          - "transformers>=5,<6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]" "${{ matrix.transformers }}"
      - run: pytest -q tests/test_adapters.py tests/test_transformers.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]" build ruff
      - run: ruff check .
      - run: python -m build
