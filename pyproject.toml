[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dllm"
version = "1.3.2"
description = "Composable discrete diffusion language model toolkit for training, inference, evaluation, and post-training"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
hf = ["transformers>=4.38"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["dllm*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
